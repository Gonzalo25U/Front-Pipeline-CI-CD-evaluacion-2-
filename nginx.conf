server {
    listen 80;
    server_name _;
 
    root /usr/share/nginx/html;
    index index.html;
 
    # Compresión gzip para reducir tamaño de transferencia
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
 
    # Assets estáticos con caché larga (Vite agrega hash al nombre del archivo)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
 
    # Proxy hacia Backend Ventas (EC2 app, IP privada)
    location /api/ventas/ {
        proxy_pass http://10.0.129.136:8081/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
 
    # Proxy hacia Backend Despachos (EC2 app, IP privada)
    location /api/despachos/ {
        proxy_pass http://10.0.129.136:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
 
    # SPA fallback: todas las rutas no encontradas van a index.html
    # Necesario para que react-router-dom funcione al refrescar la página
    location / {
        try_files $uri $uri/ /index.html;
    }
}