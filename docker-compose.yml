version: "3.9"

services:

  # ── Frontend React + Vite servido por Nginx ───────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: gonzalo25u/Front-Pipeline-CI-CD-evaluacion-2-:latest
    container_name: frontend
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      # Named volume para logs de acceso de Nginx
      # Permite revisar quién accedió al frontend sin perder el historial al reiniciar
      - nginx_logs:/var/log/nginx
    networks:
      - web-network

volumes:
  # Named volume para logs de Nginx.
  # Se prefiere named volume sobre bind mount por portabilidad:
  # no depende de rutas específicas del sistema de archivos host.
  nginx_logs:
    driver: local

networks:
  web-network:
    driver: bridge